# Build on changes; a manual run creates a SemVer GitHub release.
name: VS Code extension
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  vsix:
    name: Build VSIX
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Determine release version
        id: release-version
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          BASE_VERSION=$(node -p 'require("./package.json").version')
          VERSION=$(./scripts/next-version.sh "$BASE_VERSION")
          echo "MSL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          ./scripts/build.sh
          if [ -n "${MSL_VERSION:-}" ]; then
            FILE="msl-$MSL_VERSION.vsix"
          else
            BASE=$(node -p 'require("./package.json").version')
            FILE="msl-$BASE.vsix"
          fi
          test -s "dist/$FILE"
          echo "commit $GITHUB_SHA" > dist/build-info.txt
          echo "FILE=$FILE" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/msl-*.vsix
            dist/build-info.txt
          if-no-files-found: error

  release:
    name: Publish VS Code extension release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: vsix
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: vscode-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Validate version and build
        env:
          VERSION: ${{ needs.vsix.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be SemVer in MAJOR.MINOR.PATCH form" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          [ "$(cat dist/build-info.txt)" = "commit $GITHUB_SHA" ]
          FILE="msl-$VERSION.vsix"
          test -s "dist/$FILE"
          (cd dist && shasum -a 256 "$FILE" > release.sha256)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
      - name: Create SemVer tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dist/$FILE" dist/release.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MSL VS Code extension $VERSION" \
            --notes "The MSL extension for VS Code and compatible editors. Built by this workflow from commit $GITHUB_SHA. Install it with msl --manage-ide."
